<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picturium Image Server</title>
    <link rel="icon" href="/public/favicon.png">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            background: #09090b;
        }

        .hero {
            position: relative;
            display: grid;
            place-items: center;
            width: min(1240px, 100%);
            min-height: 100svh;
            padding: 4rem 2rem;
        }

        .logo {
            position: relative;
            z-index: 1;
            display: block;
            width: min(720px, 100%);
            height: auto;
            margin-inline: auto;
            background: #09090b;
        }

        .pixel-field {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .pixel-field i {
            position: absolute;
            top: 50%;
            right: 40%;
            width: 28px;
            height: 28px;
            transform: translateY(-50%);
        }

        @media (max-width: 700px) {
            .hero {
                padding-inline: 1.25rem;
            }

            .pixel-field i {
                right: 4%;
                opacity: .55;
                transform: translateY(-50%) scale(.6);
                transform-origin: center right;
            }
        }
    </style>
</head>
<body>
    <main class="hero">
        <div class="pixel-field" aria-hidden="true"><i></i></div>
        <img class="logo" src="/public/picturium.png" alt="Picturium">
    </main>

    <script>
        const colors = [
            '255, 58, 58',
            '255, 138, 31',
            '255, 214, 51',
            '51, 224, 102',
            '43, 212, 240',
            '58, 120, 255',
            '216, 60, 255',
        ];
        const shadows = [];
        const cellSize = 28;
        const columns = 26;
        const rows = 27;
        let seed = 0x9e3779b9;

        const random = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

        for (let column = 0; column < columns; column++) {
            const proximity = 1 - column / columns;

            for (let row = 0; row < rows; row++) {
                if (random() > proximity * 0.55) continue;

                const opacity = (.1 + random() * .3) * proximity;
                const color = colors[(column + row) % colors.length];
                const y = (row - (rows - 1) / 2) * cellSize;
                shadows.push(`${-column * cellSize}px ${y}px 0 rgba(${color}, ${opacity.toFixed(3)})`);
            }
        }

        document.querySelector('.pixel-field i').style.boxShadow = shadows.join(', ');
    </script>
</body>
</html>
