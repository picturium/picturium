<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Picturium</title>
    <link rel="icon" href="/public/favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #09090b;
            color: #e4e4e7;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
        }
        .panel {
            text-align: center;
            padding: 2rem;
        }
        .code {
            position: relative;
            display: inline-block;
            font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-weight: 700;
            font-size: clamp(5rem, 18vw, 12rem);
            line-height: 0.9;
            letter-spacing: -0.04em;
            color: #e4e4e7;
        }
        .code::before,
        .code::after {
            content: attr(data-text);
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .code::before { color: #f87171; }
        .code::after  { color: #60a5fa; }
        @keyframes glitch {
            0%, 92%, 100% { transform: translate(0, 0);    opacity: 0; }
            93%           { transform: translate(-3px, 1px); opacity: 0.75; }
            95%           { transform: translate(2px, -1px); opacity: 0.65; }
            97%           { transform: translate(-1px, 0);  opacity: 0.55; }
        }
        .code::before { animation: glitch 3.5s infinite; }
        .code::after  { animation: glitch 3.5s infinite; animation-delay: 0.06s; }
        .label {
            margin-top: 1.25rem;
            font-size: 0.8125rem;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: #71717a;
        }
        .reason {
            margin: 1.5rem auto 0;
            max-width: 34ch;
            line-height: 1.55;
            color: #a1a1aa;
        }
        @media (prefers-reduced-motion: reduce) {
            .code::before,
            .code::after { animation: none; opacity: 0; }
        }
    </style>
</head>
<body>
    <main class="panel">
        <div class="code" data-text="404">404</div>
        <div class="label">File not found</div>
        <p class="reason">The requested file could not be located on this server.</p>
    </main>
</body>
</html>
