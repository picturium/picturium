<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Picturium Image Server</title>
    <link rel="icon" href="/public/favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            background: #09090b;
            color: #e4e4e7;
            font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            overflow: hidden;
        }

        .panel {
            position: relative;
            z-index: 1;
            width: min(34rem, 100%);
            padding: clamp(2rem, 7vw, 4rem);
            background: #252420;
            text-align: center;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg,
                #ffd633, #33e066,
                #ff3a3a, #ffd633,
                #33e066, #2bd4f0,
                #ffd633, #33e066,
                #ffd633, #ff3a3a,
                #2bd4f0, #3a78ff,
                #d83cff, #ff3a3a,
                #ffd633, #33e066);
        }

        .mark {
            display: block;
            width: min(150px, 65%);
            height: auto;
            margin: 0 auto 1.5rem;
        }

        .pixel-field {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .pixel-field i {
            position: absolute;
            top: 50%;
            right: 40%;
            width: 28px;
            height: 28px;
            transform: translateY(-50%);
        }

        .label {
            display: block;
            width: max-content;
            max-width: 100%;
            margin-inline: auto;
            margin-top: 1rem;
            padding: .45rem .75rem;
            border: 2px solid #3f3f46;
            background: #18181b;
            font-size: 1.45rem;
            font-weight: 700;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: #d4d4d8;
        }

        .message {
            margin: 1.5rem auto 0;
            max-width: 34ch;
            line-height: 1.55;
            color: #a1a1aa;
        }

        @media (max-width: 700px) {
            .pixel-field i {
                right: 4%;
                opacity: .55;
                transform: translateY(-50%) scale(.6);
                transform-origin: center right;
            }
        }

        code {
            font-size: 9rem;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="pixel-field" aria-hidden="true"><i></i></div>
    <main class="panel">
        <img class="mark" src="/public/picturium.png" alt="Picturium">
        <code>404</code>
        <div class="label">File not found</div>
        <p class="message">The requested file is missing</p>
    </main>

    <script>
        const colors = [
            '255, 58, 58',
            '255, 138, 31',
            '255, 214, 51',
            '51, 224, 102',
            '43, 212, 240',
            '58, 120, 255',
            '216, 60, 255',
        ];
        const shadows = [];
        const cellSize = 28;
        const columns = 26;
        const rows = 27;
        let seed = 0x9e3779b9;

        const random = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

        for (let column = 0; column < columns; column++) {
            const proximity = 1 - column / columns;

            for (let row = 0; row < rows; row++) {
                if (random() > proximity * .55) continue;

                const opacity = (.10 + random() * .30) * proximity;
                const color = colors[(column + row) % colors.length];
                const y = (row - (rows - 1) / 2) * cellSize;
                shadows.push(`${-column * cellSize}px ${y}px 0 rgba(${color}, ${opacity.toFixed(3)})`);
            }
        }

        document.querySelector('.pixel-field i').style.boxShadow = shadows.join(', ');
    </script>
</body>
</html>
