FROM ubuntu:26.04 AS build

WORKDIR /root

# Install build tools
RUN apt update -y && \
    apt install -y software-properties-common \
    cmake \
    pkg-config \
    libglib2.0-dev \
    build-essential \
    ninja-build \
    python3-pip \
    bc \
    wget \
    curl \
    zip \
    unzip \
    tar && \
    apt autoremove && apt-get clean && rm -rf /var/lib/apt/lists/*

RUN mv /usr/lib/python3.14/EXTERNALLY-MANAGED /usr/lib/python3.14/EXTERNALLY-MANAGED.old && \
    pip3 install meson

# Install libvips libraries
RUN apt update -y && \
    apt install -y libfftw3-dev \
    libhwy-dev \
    liborc-0.4-dev \
    libopenexr-dev \
    libgsf-1-dev \
    libjpeg-turbo8-dev \
    libwebp-dev \
    libopenslide-dev \
    libmatio-dev \
    libexpat1-dev \
    libexif-dev \
    libtiff5-dev \
    libcfitsio-dev \
    librsvg2-dev \
    libpango1.0-dev \
    libopenjp2-7-dev \
    liblcms2-dev \
    libimagequant-dev \
    libjxl-dev \
    zlib1g-dev \
    libpng-dev \
    libaom-dev \
    aom-tools \
    libde265-dev \
    libyuv-dev \
    libwebm-dev \
    libpoppler-glib-dev \
    libcgif-dev \
    libraw-dev \
    libmagickcore-7.q16-dev \
    libgdk-pixbuf-xlib-2.0-dev \
    ghostscript \
    libcdr-0.1-1 \
    git && \
    apt autoremove && apt-get clean && rm -rf /var/lib/apt/lists/*
  
ENV PATH="/usr/lib/libreoffice/program:${PATH}"

# 00-local.conf overrides libheif1 system dependency
RUN cd /root && \
    wget https://github.com/strukturag/libheif/releases/download/v1.23.5/libheif-1.23.5.tar.gz && \
    tar xf libheif-1.23.5.tar.gz && \
    cmake -S libheif-1.23.5 -B libheif-1.23.5/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local \
      -DCMAKE_INSTALL_LIBDIR=lib -DWITH_EXAMPLES=OFF -DBUILD_TESTING=OFF -DWITH_GDK_PIXBUF=OFF \
      -DWITH_AOM_ENCODER_PLUGIN=OFF -DWITH_AOM_DECODER_PLUGIN=OFF -DWITH_LIBDE265_PLUGIN=OFF && \
    cmake --build libheif-1.23.5/build -j$(nproc) && \
    cmake --install libheif-1.23.5/build && \
    echo /usr/local/lib > /etc/ld.so.conf.d/00-local.conf && \
    ldconfig && \
    rm -rf libheif-1.23.5 libheif-1.23.5.tar.gz

# Install libvips
RUN cd /root && \
    wget https://github.com/libvips/libvips/releases/download/v8.18.6/vips-8.18.6.tar.xz && \
    tar xf vips-8.18.6.tar.xz && \
    cd /root/vips-8.18.6 && \
    meson setup build --libdir=lib --buildtype=release -Dintrospection=disabled && \
    cd /root/vips-8.18.6/build && \
    meson compile && \
    meson install && \
    ldconfig && \
    cd /root && rm vips-8.18.6.tar.xz && rm -rf vips-8.18.6

RUN mkdir -p /lib/x86_64-linux-gnu && mkdir -p /lib/aarch64-linux-gnu
RUN mkdir -p /usr/lib/x86_64-linux-gnu/glib-2.0 && mkdir -p /usr/lib/aarch64-linux-gnu/glib-2.0

# Install libreoffice
RUN apt update -y && \
    apt install -y libreoffice-writer-nogui \
    libreoffice-calc-nogui \
    libreoffice-impress-nogui && \
    apt autoremove && apt-get clean && rm -rf /var/lib/apt/lists/*


FROM ubuntu:26.04

COPY --from=build /usr/local/lib /usr/local/lib
COPY --from=build /usr/local/bin/vips /usr/local/bin/vips
COPY --from=build /usr/bin/gs /usr/bin/gs
COPY --from=build /usr/local/include/vips /usr/local/include/vips
COPY --from=build /lib/x86_64-linux-gnu /lib/x86_64-linux-gnu
COPY --from=build /lib/aarch64-linux-gnu /lib/aarch64-linux-gnu
COPY --from=build /usr/lib/gcc /usr/lib/gcc
COPY --from=build /usr/lib/libreoffice /usr/lib/libreoffice
COPY --from=build /usr/lib/x86_64-linux-gnu/glib-2.0 /usr/lib/x86_64-linux-gnu/glib-2.0
COPY --from=build /usr/lib/aarch64-linux-gnu/glib-2.0 /usr/lib/aarch64-linux-gnu/glib-2.0
COPY --from=build /usr/share/libreoffice /usr/share/libreoffice
COPY --from=build /usr/share/liblangtag /usr/share/liblangtag
COPY --from=build /usr/share/color /usr/share/color
COPY --from=build /usr/share/ghostscript /usr/share/ghostscript
COPY --from=build /usr/share/poppler /usr/share/poppler
COPY --from=build /usr/share/mime /usr/share/mime
COPY --from=build /etc /etc

ENV PATH="/usr/lib/libreoffice/program:${PATH}"
