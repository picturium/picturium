[package]
name = "picturium2"
version = "0.3.0"
edition = "2024"

[dependencies]
axum = "0.8"
config = { version = "0.15", default-features = false, features = ["toml"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.7.0", features = ["trace", "cors", "fs"] }
httpdate = "1.0"
http-range-header = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
picturium-libvips = { path = "../picturium-libvips" }
strum = { version = "0.28.0", features = ["derive", "strum_macros"] }
base64 = "0.23.1"
bytes = "1"
foyer = "=0.22.3"
scopeguard = "1.2.0"
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
fs4 = "1.1.0"
lopdf = { version = "0.44.0", default-features = false }
krilla = { version = "0.8", default-features = false, features = ["raster-images"] }
krilla-svg = "0.8"
usvg = "0.47"
tempfile = "3"

[patch.crates-io]
# Unreleased fix for fastant TSC calibration overflow in containers.
fastant = { git = "https://github.com/fast/fastant", rev = "164fc07176f59072c47ff51c46381a3edd8e970c" }
